<!DOCTYPE html>
<html lang="vi">	
<head>		
    <meta charset="utf-8">		
    <title>Hóa đơn thanh toán</title>
    <link rel="stylesheet" href="../css/style4.css">
</head>
<body> 
    <table border="3">     
        <tr>
            <th>STT</th>
            <th>Tên sản phẩm</th>
            <th>Số lượng</th>
            <th>Đơn giá</th>
            <th>Thành tiền</th>
        </tr>
        <tr>
            <td>1</td>
            <td>A</td>
            <td class="sl">3</td>
            <td class="dg">1000</td>
            <td class="tt"></td>
        </tr>
        <tr>
            <td>2</td>
            <td>B</td>
            <td class="sl">2</td>
            <td class="dg">2000</td>
            <td class="tt"></td>
        </tr>
        <tr>
            <td>3</td>
            <td>C</td>
            <td class="sl">4</td>
            <td class="dg">3000</td>
            <td class="tt"></td> 
        </tr>
        <tr>
            <td colspan="3">Tổng thanh toán</td>
            <td id="TongThanhToan" colspan="2"></td>

        </tr>
    </table>  
    <script>
    const dg = document.getElementsByClassName('dg');
    const sl = document.getElementsByClassName('sl'); 
    const tt = document.getElementsByClassName('tt');
    let tongThanhToan = 0;      
     for (let i = 0; i < dg.length; i++) {
        tt[i].innerHTML = dg[i].innerHTML * sl[i].innerHTML;
        tongThanhToan += parseInt(tt[i].innerHTML);
     }          
    document.getElementById('TongThanhToan').innerHTML = tongThanhToan;

    </script>
</body>
</html>
