<!DOCTYPE html>
<html lang="vi">	
<head>		
    <meta charset="utf-8">		
	<title>Thiết kế form</title>
	<link rel = "stylesheet" href = "../css/style2.css">
</head>
<body>
    <div class="container">
        <form id="frmLogin">
            <h3 class="title">Thông tin đăng nhập</h3>
            <div class="formgroup">
                <label for="">Tên đăng nhập:</label>
                <input class="formcontrol" id="textUsername" name="textUserName" placeholder="Nhập tài khoản">
            </div>
            <div class="formgroup">
                <label for="">Mật khẩu:</label>
                <input class="formcontrol" type="password" id="textPassword" name="textPassword" placeholder="Nhập mật khẩu">
            </div>
            <input class="button" type="submit" value="Đăng nhập">
            <input class="button" type="reset" value="Hủy bỏ">
        </form>
    </div>
</body>
</html>
